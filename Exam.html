<!DOCTYPE html>
<html lang="vi">
    
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading · Premium</title>

    <!-- Favicon Mũ Cử Nhân + Ngôi Sao (màu tím) -->
    <link class="brand-logo" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8.5' fill='%23faf8ff' stroke='rgba%28124,58,237,0.25%29' stroke-width='1'/%3E%3Cg transform='translate%285,5%29' stroke='%237c3aed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M11 2L2 6.5l9 4.5 9-4.5z' fill='%237c3aed' fill-opacity='0.12'/%3E%3Cpath d='M17 7.5v4.5c0 .5.5 1 .8 1.5'/%3E%3Cpath d='M5.5 8.5v4.5c0 1.5 1.5 2.5 5.5 2.5s5.5-1 5.5-2.5V8.5'/%3E%3Cpath d='M19 1l.5 1.5L21 3l-1.5.5L19 5l-.5-1.5L17 3l1.5-.5z' fill='%237c3aed' stroke='none'/%3E%3C/svg%3E" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest">
    </script>

    <style>
        /* ===== RESET & VARIABLES — Premium iOS (Purple Theme) ===== */
        :root {
            --bg-primary: #faf8ff;
            --bg-secondary: #f3f0ff;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-raised: rgba(255, 255, 255, 0.95);
            --surface-blur: rgba(255, 255, 255, 0.70);

            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-glow: rgba(124, 58, 237, 0.25);
            --primary-subtle: rgba(124, 58, 237, 0.08);

            --navy: #1e1b4b;
            --navy-light: #312e81;
            --text-primary: #1e1b4b;
            --text-secondary: #5a5a7a;
            --text-tertiary: #8a8aaa;
            --text-inverse: #faf8ff;

            --border-subtle: rgba(124, 58, 237, 0.12);
            --border-primary: rgba(124, 58, 237, 0.30);

            --shadow-soft: 0 4px 24px rgba(30, 27, 75, 0.04);
            --shadow-medium: 0 8px 40px rgba(30, 27, 75, 0.06);
            --shadow-primary: 0 8px 32px rgba(124, 58, 237, 0.18);
            --shadow-card: 0 2px 16px rgba(30, 27, 75, 0.04), 0 1px 4px rgba(30, 27, 75, 0.02);

            --radius-glass: 20px;
            --radius-card: 16px;
            --radius-sm: 10px;
            --radius-pill: 40px;

            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-display: 'Inter', -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            --font-body: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-primary);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== SCROLLBAR — refined ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.30);
            border-radius: 12px;
            transition: var(--transition-smooth);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.50);
        }

        /* ===== HEADER — Premium Glass ===== */
        .header {
            background: var(--surface-blur);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            height: 68px;
            position: relative;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            opacity: 0.4;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header h1 .brand-word {
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
            position: relative;
        }

        .header h1 .brand-word::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2.5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 4px;
            opacity: 0.3;
            transform: scaleX(0.6);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .header h1:hover .brand-word::after {
            transform: scaleX(1);
            opacity: 0.6;
        }

        .brand-divider {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-weight: 300;
            font-size: 1.1rem;
            opacity: 0.5;
            padding: 0 0.1rem;
        }

        .brand-sub {
            font-weight: 500;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.10), rgba(124, 58, 237, 0.02));
            border: 1.2px solid var(--border-primary);
            transition: var(--transition-smooth);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.08);
        }

        .brand-logo-container:hover {
            transform: scale(1.04) rotate(-1deg);
            background: rgba(124, 58, 237, 0.14);
            border-color: var(--primary);
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .brand-logo-container svg {
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Sync Badge — Premium */
        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 0.3rem 0.9rem 0.3rem 0.7rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
            letter-spacing: 0.02em;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .sync-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-tertiary);
            transition: var(--transition-smooth);
        }

        .sync-badge.syncing {
            color: var(--primary);
            background: rgba(124, 58, 237, 0.10);
            border-color: var(--border-primary);
        }
        .sync-badge.syncing .dot {
            background: var(--primary);
            animation: pulsePrimary 1.2s infinite;
        }

        .sync-badge.synced {
            color: #2d7a4a;
            background: rgba(45, 122, 74, 0.08);
            border-color: rgba(45, 122, 74, 0.15);
        }
        .sync-badge.synced .dot {
            background: #2d7a4a;
        }

        @keyframes pulsePrimary {
            0% {
                transform: scale(0.85);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
            100% {
                transform: scale(0.85);
                opacity: 0.4;
            }
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition-smooth);
            letter-spacing: 0.02em;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--border-primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
            color: var(--navy);
        }

        .btn-secondary i {
            color: var(--primary);
            transition: var(--transition-smooth);
        }
        .btn-secondary:hover i {
            transform: rotate(8deg);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ===== INPUT PANEL — Premium Slide ===== */
        .input-panel {
            width: 460px;
            background: var(--surface-raised);
            backdrop-filter: blur(12px) saturate(1.1);
            -webkit-backdrop-filter: blur(12px) saturate(1.1);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 8px 0 40px rgba(30, 27, 75, 0.04);
            z-index: 30;
            position: relative;
        }

        .input-panel::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 10%;
            height: 80%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border-primary), transparent);
            opacity: 0.3;
        }

        .input-panel.hidden {
            margin-left: -460px;
            box-shadow: none;
        }
        .input-panel.hidden::after {
            opacity: 0;
        }

        .panel-header-area {
            padding: 1.8rem 2rem 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            letter-spacing: -0.01em;
        }

        .panel-title .primary-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .panel-scroll-content {
            flex: 1;
            overflow: hidden;
            padding: 0.8rem 2rem 0.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        .panel-scroll-content label {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.6rem;
            padding-left: 0.1rem;
        }

        .panel-scroll-content textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            line-height: 1.65;
            background: var(--bg-primary);
            transition: var(--transition-smooth);
            resize: none;
            flex: 1;
            min-height: 200px;
            color: var(--text-primary);
            font-family: var(--font-body);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .panel-scroll-content textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px var(--primary-subtle), inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .panel-scroll-content textarea::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
            opacity: 0.6;
        }

        .panel-footer-btn-wrapper {
            padding: 1.2rem 2rem 1.8rem 2rem;
            background: transparent;
            border-top: 1px solid var(--border-subtle);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.9rem 1.4rem;
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 16px var(--primary-glow);
            letter-spacing: 0.02em;
            font-family: var(--font-display);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 60%);
            pointer-events: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary i {
            transition: var(--transition-smooth);
        }
        .btn-primary:hover i {
            transform: rotate(-6deg) scale(1.1);
        }

        /* ===== WORKSPACE ===== */
        .workspace-panel {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Empty State — Premium */
        .empty-state {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            background: transparent;
            padding: 2.5rem;
            animation: fadeIn 0.6s ease;
        }

        .empty-state-icon {
            font-size: 2.8rem;
            margin-bottom: 1.4rem;
            color: var(--primary);
            background: var(--primary-subtle);
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1.5px solid var(--border-primary);
            box-shadow: 0 12px 40px var(--primary-glow);
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
        }

        .empty-state-icon:hover {
            transform: scale(1.03) rotate(-2deg);
        }

        .empty-state h2 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 750;
            color: var(--navy);
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
        }

        .empty-state p {
            font-size: 0.95rem;
            color: var(--text-tertiary);
            max-width: 380px;
            line-height: 1.6;
        }

        /* ===== QUIZ SPLIT LAYOUT ===== */
        .quiz-split-layout {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            flex-direction: row;
            background: transparent;
        }

        /* Mobile tabs */
        .mobile-tabs {
            display: none;
            background: var(--surface-raised);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 15;
            padding: 0 0.5rem;
        }

        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 0.9rem 0.5rem 0.8rem;
            font-weight: 650;
            font-size: 0.82rem;
            color: var(--text-tertiary);
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-bottom: 2.5px solid transparent;
            transition: var(--transition-smooth);
            font-family: var(--font-display);
            letter-spacing: 0.02em;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-subtle);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }

        .tab-btn i {
            transition: var(--transition-smooth);
        }
        .tab-btn.active i {
            color: var(--primary);
        }

        /* ===== QUESTIONS COLUMN ===== */
        .quiz-questions-side {
            flex: 0.9;
            overflow-y: auto;
            padding: 1.8rem 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: transparent;
        }

        /* Shuffle toolbar */
        .shuffle-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .shuffle-toolbar .btn-secondary {
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .shuffle-toolbar .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--primary);
            color: var(--navy);
            transform: translateY(-1px);
        }
        .shuffle-toolbar .btn-secondary i {
            color: var(--primary);
        }

        /* ===== READING COLUMN — Premium ===== */
        .quiz-reading-side {
            flex: 1.1;
            border-left: 1px solid var(--border-subtle);
            background: var(--surface-raised);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: -4px 0 24px rgba(30, 27, 75, 0.02);
            position: relative;
        }

        .quiz-reading-side::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 10%;
            height: 80%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border-primary), transparent);
            opacity: 0.2;
        }

        .reading-scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 3rem 3.5rem;
        }

        /* ===== READING TYPOGRAPHY — Luxury ===== */
        .reading-title {
            font-family: var(--font-display);
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--navy);
            line-height: 1.2;
            margin-bottom: 0.15rem;
            letter-spacing: -0.03em;
            position: relative;
        }

        .reading-title::after {
            content: '';
            display: block;
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 4px;
            margin-top: 0.6rem;
            opacity: 0.6;
        }

        .reading-author {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            font-style: italic;
            margin-bottom: 1.8rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 400;
        }

        .reading-paragraph {
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.9;
            margin-bottom: 1.5rem;
            text-align: justify;
            text-justify: inter-word;
            letter-spacing: -0.002em;
            font-weight: 400;
        }

        .reading-paragraph:first-of-type::first-letter {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--primary);
            float: left;
            margin-right: 0.5rem;
            line-height: 1;
            margin-top: 0.1rem;
            font-family: var(--font-display);
        }

        /* ===== QUIZ ITEMS — Premium Cards ===== */
        .quiz-item {
            background: var(--surface-raised);
            backdrop-filter: blur(4px);
            padding: 1.6rem 1.8rem;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .quiz-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .quiz-item:hover {
            box-shadow: var(--shadow-medium);
            border-color: var(--border-primary);
            transform: translateY(-1px);
        }

        .quiz-item:hover::before {
            opacity: 0.6;
        }

        .quiz-item-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 1.1rem;
            color: var(--navy);
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        .quiz-item-text .qnum {
            color: var(--primary);
            font-weight: 800;
            margin-right: 0.25rem;
        }

        /* ===== CUSTOM RADIO BUTTONS - LARGER & INSIDE ===== */
        .render-option {
            display: flex;
            align-items: center;
            padding: 0.7rem 1.1rem;
            background: var(--bg-primary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            min-height: 52px;
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: var(--font-body);
            position: relative;
            user-select: none;
        }

        .render-option:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--border-primary);
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.06);
        }

        /* Hide default radio */
        .render-option input[type="radio"] {
            display: none;
        }

        /* Custom radio circle */
        .custom-radio {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 700;
            margin-right: 1rem;
            flex-shrink: 0;
            transition: var(--transition-smooth);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .render-option:hover .custom-radio {
            border-color: var(--primary);
            background: rgba(124, 58, 237, 0.05);
            transform: scale(1.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .render-option input[type="radio"]:checked+.custom-radio {
            background: linear-gradient(135deg, var(--primary), #5b21b6);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            transform: scale(1.05);
        }

        .render-option.selected-card {
            border-color: var(--primary);
            background: var(--primary-subtle);
            box-shadow: 0 0 0 3px var(--primary-glow);
            transform: translateX(4px);
        }

        .option-text {
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* ===== EXPLANATION — Premium, more compact ===== */
        .explanation-box {
            display: none;
            margin-top: 0.6rem;
            padding: 0.6rem 1rem;
            background: rgba(45, 122, 74, 0.06);
            border-left: 4px solid #2d7a4a;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #1a4a3a;
            line-height: 1.5;
            font-weight: 450;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .explanation-box.is-wrong {
            background: rgba(200, 60, 60, 0.06);
            border-left-color: #c83c3c;
            color: #7a2a2a;
        }

        .explanation-box strong {
            font-weight: 700;
            color: inherit;
        }

        .explanation-box .correct-answer {
            font-weight: 600;
            color: var(--primary);
        }

        /* ===== SCORE RESULT — Compact + lắc lắc hoài ===== */
        #score-result {
            display: none;
            margin-top: 0.3rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            background: linear-gradient(135deg, var(--navy), #312e81);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-primary);
            border: 1px solid rgba(124, 58, 237, 0.15);
            position: relative;
            overflow: hidden;
            line-height: 1.4;
            opacity: 0;
            transform-origin: center;
            will-change: transform;
            transition: opacity 0.3s ease;
        }

        #score-result.show {
            display: block;
            opacity: 1;
            animation: scoreWiggle 1.2s ease-in-out infinite;
        }

        @keyframes scoreWiggle {
            0% { transform: rotate(0deg) scale(1); }
            10% { transform: rotate(2deg) scale(1.02); }
            20% { transform: rotate(-2deg) scale(1.01); }
            30% { transform: rotate(1.5deg) scale(1.03); }
            40% { transform: rotate(-1.5deg) scale(1.02); }
            50% { transform: rotate(1deg) scale(1.01); }
            60% { transform: rotate(-1deg) scale(1.02); }
            70% { transform: rotate(0.8deg) scale(1.01); }
            80% { transform: rotate(-0.8deg) scale(1.02); }
            90% { transform: rotate(0.3deg) scale(1.01); }
            100% { transform: rotate(0deg) scale(1); }
        }

        #score-result .score-emoji {
            font-size: 1.2rem;
            display: inline-block;
            margin-right: 0.3rem;
            vertical-align: middle;
        }

        #score-result .score-text {
            display: inline-block;
            vertical-align: middle;
        }

        #score-result .score-detail {
            font-weight: 400;
            opacity: 0.8;
            font-size: 0.8rem;
            margin-left: 0.3rem;
        }

        /* ===== SUBMIT BUTTON — Premium ===== */
        .submit-btn-wrapper {
            position: sticky;
            bottom: -2rem;
            background: linear-gradient(to top, var(--bg-primary) 75%, transparent);
            padding: 1.2rem 0 0.6rem 0;
            width: 100%;
            margin-top: auto;
            z-index: 10;
        }

        .submit-btn-wrapper .btn-primary {
            background: linear-gradient(135deg, #2d7a4a, #1f5a36);
            box-shadow: 0 4px 20px rgba(45, 122, 74, 0.25);
            font-size: 0.92rem;
        }

        .submit-btn-wrapper .btn-primary:hover {
            box-shadow: 0 8px 32px rgba(45, 122, 74, 0.35);
            transform: translateY(-2px);
        }

        /* ===== STATUS TRACKER — Premium ===== */
        .status-tracker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-raised);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            margin-bottom: 0.2rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            box-shadow: var(--shadow-card);
            font-family: var(--font-display);
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .status-tracker .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 20px;
            margin: 0 0.8rem;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
            min-width: 50px;
        }

        .status-tracker .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 20px;
        }

        .status-tracker .tracker-label {
            font-weight: 500;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        .status-tracker .tracker-count {
            color: var(--primary);
            font-weight: 700;
            white-space: nowrap;
        }

        /* Clear all button */
        .btn-clear-all {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-tertiary);
            padding: 0.15rem 0.6rem;
            border-radius: var(--radius-pill);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-family: var(--font-display);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .btn-clear-all:hover {
            background: rgba(124, 58, 237, 0.08);
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.02);
        }

        .btn-clear-all:active {
            transform: scale(0.95);
        }

        /* ===== TOAST — Premium với hiệu ứng nhảy "ton ton" ===== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: calc(100% - 48px);
            pointer-events: none;
        }

        .toast {
            background: var(--surface-raised);
            backdrop-filter: blur(18px) saturate(1.2);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 0.9rem 1.4rem;
            box-shadow: var(--shadow-medium);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            pointer-events: auto;
            border: 1px solid var(--border-subtle);
            opacity: 0;
            transform: translateX(120%) scale(0.7);
            transition: none;
            will-change: transform, opacity;
        }

        .toast.show {
            animation: bounceIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .toast.toast-error {
            border-left-color: #c83c3c;
        }
        .toast.toast-success {
            border-left-color: #2d7a4a;
        }
        .toast.toast-warning {
            border-left-color: #d4a035;
        }

        .toast .toast-icon {
            flex-shrink: 0;
            color: var(--primary);
        }
        .toast.toast-error .toast-icon {
            color: #c83c3c;
        }
        .toast.toast-success .toast-icon {
            color: #2d7a4a;
        }

        /* Hiệu ứng nhảy "ton ton" */
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: translateX(120%) scale(0.6) rotate(-2deg);
            }
            35% {
                opacity: 1;
                transform: translateX(-12%) scale(1.08) rotate(1deg);
            }
            50% {
                transform: translateX(6%) scale(0.96) rotate(-0.5deg);
            }
            65% {
                transform: translateX(-4%) scale(1.02) rotate(0.3deg);
            }
            80% {
                transform: translateX(2%) scale(0.99) rotate(-0.1deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1) rotate(0deg);
            }
        }

        /* Hiệu ứng biến mất khi đóng */
        .toast.hiding {
            animation: bounceOut 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes bounceOut {
            0% {
                opacity: 1;
                transform: translateX(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateX(80%) scale(0.6) rotate(3deg);
            }
        }

        /* ===== RESPONSIVE — Premium ===== */
        @media (max-width: 900px) {
            .input-panel {
                position: fixed;
                left: 0;
                top: 68px;
                bottom: 0;
                height: calc(100vh - 68px);
                width: 100%;
                max-width: 420px;
                transform: translateX(0);
                z-index: 50;
                border-radius: 0 20px 20px 0;
                box-shadow: 12px 0 48px rgba(30, 27, 75, 0.06);
            }

            .input-panel.hidden {
                transform: translateX(-100%);
                margin-left: 0;
            }

            .input-panel::after {
                display: none;
            }

            body.quiz-active .mobile-tabs {
                display: flex;
            }

            .quiz-split-layout {
                flex-direction: column;
            }

            .quiz-questions-side,
            .quiz-reading-side {
                display: none;
                flex: 1;
                width: 100%;
                border-left: none;
                height: 100%;
            }

            .quiz-split-layout.show-reading .quiz-reading-side {
                display: flex;
            }
            .quiz-split-layout.show-questions .quiz-questions-side {
                display: flex;
            }

            .quiz-reading-side::before {
                display: none;
            }

            .reading-scroll-container {
                padding: 1.8rem 1.5rem;
            }

            .quiz-questions-side {
                padding: 1.2rem 1.2rem 1.8rem 1.2rem;
            }

            .header {
                padding: 0.4rem 1.2rem;
                height: 64px;
            }
            .header h1 {
                font-size: 1rem;
            }
            .header h1 .brand-word {
                font-size: 1.05rem;
            }
            .brand-logo-container {
                width: 34px;
                height: 34px;
                border-radius: 12px;
            }
            .brand-logo-container svg {
                width: 18px;
                height: 18px;
            }
            .sync-badge span {
                display: none;
            }
            .sync-badge {
                padding: 0.25rem 0.6rem;
            }
            .btn-secondary {
                font-size: 0.7rem;
                padding: 0.25rem 0.7rem;
            }
            .btn-secondary span {
                display: none;
            }
            .reading-title {
                font-size: 1.6rem;
            }
            .reading-title::after {
                width: 32px;
            }
            .reading-paragraph:first-of-type::first-letter {
                font-size: 2rem;
            }
            .quiz-item {
                padding: 1.2rem 1.4rem;
            }
            .custom-radio {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
                margin-right: 0.8rem;
            }
            .render-option {
                min-height: 46px;
                padding: 0.5rem 0.9rem;
            }
            .status-tracker {
                font-size: 0.7rem;
                padding: 0.3rem 0.8rem;
                border-radius: var(--radius-sm);
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .status-tracker .progress-bar {
                margin: 0 0.5rem;
                min-width: 40px;
            }
            .btn-clear-all {
                font-size: 0.6rem;
                padding: 0.15rem 0.5rem;
            }
            #score-result {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
            #score-result .score-emoji {
                font-size: 1rem;
            }
            .explanation-box {
                font-size: 0.8rem;
                padding: 0.5rem 0.8rem;
            }
            .toast-container {
                top: 72px;
                right: 16px;
                max-width: 320px;
                width: calc(100% - 32px);
            }
            .toast {
                font-size: 0.82rem;
                padding: 0.7rem 1rem;
            }
            .shuffle-toolbar .btn-secondary {
                font-size: 0.65rem;
                padding: 0.15rem 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .input-panel {
                max-width: 100%;
                border-radius: 0;
            }
            .panel-header-area {
                padding: 1.2rem 1.2rem 0.5rem 1.2rem;
            }
            .panel-scroll-content {
                padding: 0.5rem 1.2rem;
            }
            .panel-footer-btn-wrapper {
                padding: 1rem 1.2rem 1.4rem;
            }
            .reading-scroll-container {
                padding: 1.2rem 1rem;
            }
            .reading-title {
                font-size: 1.3rem;
            }
            .quiz-item {
                padding: 1rem 1.1rem;
            }
            .quiz-item-text {
                font-size: 0.92rem;
            }
            .render-option {
                font-size: 0.85rem;
                padding: 0.5rem 0.7rem;
                min-height: 42px;
            }
            .custom-radio {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
                margin-right: 0.6rem;
            }
            .status-tracker {
                font-size: 0.65rem;
                padding: 0.25rem 0.6rem;
                border-radius: var(--radius-sm);
            }
            .status-tracker .progress-bar {
                margin: 0 0.4rem;
                min-width: 30px;
            }
            .btn-clear-all {
                font-size: 0.55rem;
                padding: 0.1rem 0.4rem;
            }
            .header h1 {
                font-size: 0.85rem;
            }
            .header h1 .brand-word {
                font-size: 0.9rem;
            }
            .brand-logo-container {
                width: 30px;
                height: 30px;
                border-radius: 10px;
            }
            .brand-logo-container svg {
                width: 16px;
                height: 16px;
            }
            .empty-state-icon {
                width: 72px;
                height: 72px;
                font-size: 2rem;
            }
            .empty-state h2 {
                font-size: 1.2rem;
            }
            .toast-container {
                top: 68px;
                right: 12px;
                max-width: 280px;
                width: calc(100% - 24px);
            }
            .toast {
                font-size: 0.78rem;
                padding: 0.6rem 0.9rem;
                gap: 0.5rem;
            }
            .toast .toast-icon {
                width: 16px !important;
                height: 16px !important;
            }
            #score-result {
                font-size: 0.75rem;
                padding: 0.3rem 0.6rem;
                margin-top: 0.2rem;
                margin-bottom: 0.3rem;
            }
            #score-result .score-emoji {
                font-size: 0.9rem;
            }
            .explanation-box {
                font-size: 0.75rem;
                padding: 0.4rem 0.6rem;
            }
            .shuffle-toolbar .btn-secondary {
                font-size: 0.6rem;
                padding: 0.1rem 0.5rem;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-item {
            animation: fadeIn 0.5s ease both;
        }

        .quiz-item:nth-child(1) {
            animation-delay: 0.02s;
        }
        .quiz-item:nth-child(2) {
            animation-delay: 0.06s;
        }
        .quiz-item:nth-child(3) {
            animation-delay: 0.10s;
        }
        .quiz-item:nth-child(4) {
            animation-delay: 0.14s;
        }
        .quiz-item:nth-child(5) {
            animation-delay: 0.18s;
        }
        .quiz-item:nth-child(6) {
            animation-delay: 0.22s;
        }
        .quiz-item:nth-child(7) {
            animation-delay: 0.26s;
        }
        .quiz-item:nth-child(8) {
            animation-delay: 0.30s;
        }
        .quiz-item:nth-child(9) {
            animation-delay: 0.34s;
        }
        .quiz-item:nth-child(10) {
            animation-delay: 0.38s;
        }

        /* Primary shimmer for special elements */
        .primary-shimmer {
            background: linear-gradient(120deg, transparent 0%, rgba(124, 58, 237, 0.06) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- HEADER — Premium -->
    <div class="header">
        <h1>
            <div class="brand-logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; color: var(--primary);">
                    <path d="M12 2L2 7l10 5 10-5z" fill="currentColor" fill-opacity="0.12" />
                    <path d="M19 8.5V13c0 .5.5 1 1 1.5" />
                    <path d="M6 9.5v5c0 2 2 3 6 3s6-1 6-3v-5" />
                    <path d="M21 2l.3.8.7.2-.7.3-.3.7-.3-.7-.7-.3.7-.2z" fill="currentColor" stroke="none" />
                </svg>
            </div>
            <span class="brand-word">Reading</span>
            <span class="brand-divider">·</span>
            <span class="brand-sub">Online Test</span>
        </h1>
        <div class="header-right">
            <div id="syncBadge" class="sync-badge">
                <div class="dot"></div>
                <span id="syncText">Đang lưu...</span>
            </div>
            <button type="button" class="btn-secondary" onclick="toggleInputPanel()">
                <i data-lucide="sliders-horizontal" style="width: 15px; height: 15px;"></i>
                <span>Cấu Hình</span>
            </button>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-container">

        <!-- INPUT PANEL — Premium -->
        <div class="input-panel" id="inputPanel">
            <div class="panel-header-area">
                <div class="panel-title">
                    <span class="primary-dot"></span>
                    Nhập Dữ Liệu
                </div>
            </div>

            <div class="panel-scroll-content">
                <div style="display: flex; flex-direction: column; flex: 1; height: 100%;">
                    <label>Dán Toàn Bộ Tài Liệu (Bài đọc + Câu hỏi + Đáp án)</label>
                    <textarea id="bulkAllInOne" placeholder="Sao chép văn bản đề thi từ Word/PDF và dán vào đây...

Hệ thống tự động nhận diện:
• Tiêu đề & nội dung bài đọc
• Danh sách câu hỏi (1, 2, 3...)
• Đáp án ở cuối (1 B, 2 C...)" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel-footer-btn-wrapper">
                <button type="button" class="btn-primary" onclick="processAndGenerateQuiz(true)">
                    <i data-lucide="sparkles" style="width: 18px; height: 18px;"></i>
                    Phân Tách &amp; Tạo Giao Diện
                </button>
            </div>
        </div>

        <!-- WORKSPACE -->
        <div class="workspace-panel">
            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">
                    <i data-lucide="book-open" style="width: 34px; height: 34px;"></i>
                </div>
                <h2>Hệ Thống Sẵn Sàng</h2>
                <p>Dán đề thi vào ô bên trái và nhấn <strong style="color:var(--primary);">Phân Tách &amp; Tạo Giao Diện</strong></p>
            </div>

            <!-- Mobile Tabs -->
            <div class="mobile-tabs" id="mobileTabs">
                <button class="tab-btn active" id="tabBtnReading" onclick="switchMobileTab('reading')">
                    <i data-lucide="book-text" style="width: 17px; height: 17px;"></i>
                    Bài Đọc
                </button>
                <button class="tab-btn" id="tabBtnQuestions" onclick="switchMobileTab('questions')">
                    <i data-lucide="help-circle" style="width: 17px; height: 17px;"></i>
                    Câu Hỏi
                </button>
            </div>

            <!-- QUIZ SPLIT LAYOUT -->
            <div class="quiz-split-layout show-reading" id="quizSplitLayout" style="display: none;">

                <!-- Questions Column -->
                <div class="quiz-questions-side" id="questionsColumn">
                    <!-- Shuffle Toolbar -->
                    <div class="shuffle-toolbar">
                        <button class="btn-secondary" onclick="shuffleQuestions()" title="Xáo trộn thứ tự câu hỏi">
                            <i data-lucide="shuffle" style="width: 14px; height: 14px;"></i> Trộn câu hỏi
                        </button>
                        <button class="btn-secondary" onclick="shuffleOptions()" title="Xáo trộn thứ tự các lựa chọn">
                            <i data-lucide="list-ordered" style="width: 14px; height: 14px;"></i> Trộn đáp án
                        </button>
                        <button class="btn-secondary" onclick="resetShuffle()" title="Khôi phục thứ tự ban đầu">
                            <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i> Reset
                        </button>
                    </div>

                    <div class="status-tracker">
                        <span class="tracker-label">Tiến trình</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="tracker-count" id="trackerText">0 / 0</span>
                        <button class="btn-clear-all" onclick="clearAllAnswers()" title="Bỏ chọn tất cả đáp án">
                            <i data-lucide="x-circle" style="width: 13px; height: 13px;"></i>
                            Bỏ chọn
                        </button>
                    </div>

                    <div id="quizQuestionsArea"></div>

                    <div class="submit-btn-wrapper">
                        <div id="score-result"></div>
                        <button class="btn-primary" onclick="checkAnswers(true)">
                            <i data-lucide="check-circle-2" style="width: 19px; height: 19px;"></i>
                            Nộp Bài &amp; Xem Lời Giải
                        </button>
                    </div>
                </div>

                <!-- Reading Column -->
                <div class="quiz-reading-side" id="readingColumn">
                    <div class="reading-scroll-container">
                        <div class="reading-title" id="renderTitle"></div>
                        <div class="reading-author" id="renderAuthor"></div>
                        <div id="renderParagraphs"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ===== GLOBAL STATE =====
        window._quizSubmitted = false;
        window._originalQuestions = []; // lưu câu hỏi gốc
        window._currentQuestions = []; // câu hỏi hiện tại (có thể bị xáo trộn)

        // ===== SYNC BADGE =====
        function updateSyncBadge(status) {
            const badge = document.getElementById('syncBadge');
            const text = document.getElementById('syncText');
            badge.className = 'sync-badge';

            if (status === 'saving') {
                badge.classList.add('syncing');
                text.textContent = 'Đang lưu...';
            } else if (status === 'saved') {
                badge.classList.add('synced');
                text.textContent = 'Đã lưu';
            } else {
                text.textContent = 'Sẵn sàng';
            }
        }

        let saveTimeout = null;

        function saveDraftToLocal() {
            updateSyncBadge('saving');

            const allInOne = document.getElementById('bulkAllInOne').value;
            const activeAnswers = {};
            document.querySelectorAll('.quiz-item input[type="radio"]:checked').forEach(input => {
                activeAnswers[input.name] = input.value;
            });

            const quizActive = document.body.classList.contains('quiz-active');

            try {
                localStorage.setItem('ket_pet_quiz_draft_v2', JSON.stringify({
                    allInOne,
                    activeAnswers,
                    quizActive,
                    submitted: window._quizSubmitted || false,
                    updatedAt: new Date().toISOString(),
                    currentQuestions: window._currentQuestions || [],
                    originalQuestions: window._originalQuestions || []
                }));
                setTimeout(() => updateSyncBadge('saved'), 400);
            } catch (e) { console.error(e); }
        }

        function triggerAutoSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveDraftToLocal, 1000);
        }

        document.getElementById('bulkAllInOne').addEventListener('input', triggerAutoSave);

        function loadSavedData() {
            try {
                const raw = localStorage.getItem('ket_pet_quiz_draft_v2');
                if (!raw) { updateSyncBadge('saved'); return; }
                const data = JSON.parse(raw);
                if (data.allInOne) document.getElementById('bulkAllInOne').value = data.allInOne;
                if (data.quizActive && data.allInOne) {
                    processAndGenerateQuiz(false);
                    // Restore shuffled state if any
                    if (data.currentQuestions && data.currentQuestions.length) {
                        window._currentQuestions = data.currentQuestions;
                        window._originalQuestions = data.originalQuestions || window._originalQuestions;
                        renderQuestionsFromCurrent();
                    }
                    if (data.activeAnswers) {
                        Object.keys(data.activeAnswers).forEach(name => {
                            const val = data.activeAnswers[name];
                            const input = document.querySelector(`input[name="${name}"][value="${val}"]`);
                            if (input) {
                                input.checked = true;
                                input.closest('.render-option')?.classList.add('selected-card');
                            }
                        });
                        updateProgress();
                    }
                    if (data.submitted === true) {
                        window._quizSubmitted = true;
                        setTimeout(() => {
                            checkAnswers(false);
                        }, 100);
                    }
                }
                updateSyncBadge('saved');
            } catch (e) { console.error(e); }
        }

        window.onload = function() {
            loadSavedData();
        };

        // ===== GLOBAL FUNCTIONS =====
        function toggleInputPanel() {
            document.getElementById('inputPanel').classList.toggle('hidden');
        }

        function switchMobileTab(tabName) {
            const layout = document.getElementById('quizSplitLayout');
            const btnReading = document.getElementById('tabBtnReading');
            const btnQuestions = document.getElementById('tabBtnQuestions');

            if (tabName === 'reading') {
                layout.classList.add('show-reading');
                layout.classList.remove('show-questions');
                btnReading.classList.add('active');
                btnQuestions.classList.remove('active');
            } else {
                layout.classList.add('show-questions');
                layout.classList.remove('show-reading');
                btnQuestions.classList.add('active');
                btnReading.classList.remove('active');
            }
        }

        function updateProgress() {
            const total = document.querySelectorAll('.quiz-item').length;
            const answered = document.querySelectorAll('.quiz-item input[type="radio"]:checked').length;
            const pct = total > 0 ? (answered / total) * 100 : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('trackerText').textContent = answered + ' / ' + total;
            triggerAutoSave();
        }

        // ===== TOAST VỚI HIỆU ỨNG NHẢY "TON TON" =====
        function showNotification(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            const iconMap = { success: 'check-circle', error: 'alert-triangle', warning: 'alert-circle', info: 'info' };
            toast.innerHTML = `
                    <i class="toast-icon" data-lucide="${iconMap[type] || 'info'}" style="width:19px;height:19px;stroke-width:2.5;"></i>
                    <div>${message}</div>
                `;
            container.appendChild(toast);
            lucide.createIcons({ attrs: { class: 'toast-icon' } });

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            const timeout = setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hiding');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 450);
            }, 3500);

            toast.addEventListener('click', () => {
                clearTimeout(timeout);
                toast.classList.remove('show');
                toast.classList.add('hiding');
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 450);
            });
        }

        // ===== PARSER =====
        function parseAllInOneText(rawText) {
            let readingRaw = "",
                questionsRaw = "",
                answersRaw = "";
            let remainingText = rawText.trim();

            const answerMarkerRegex = /\n\s*(?:answers?|đáp\s+án|key|keys)[\s.:-]*/i;
            const answerMarkerMatch = remainingText.match(answerMarkerRegex);
            if (answerMarkerMatch) {
                const index = answerMarkerMatch.index;
                answersRaw = remainingText.substring(index + answerMarkerMatch[0].length).trim();
                remainingText = remainingText.substring(0, index).trim();
            } else {
                const lines = remainingText.split('\n');
                for (let i = lines.length - 1; i >= Math.max(0, lines.length - 3); i--) {
                    const line = lines[i].trim();
                    const matches = [...line.matchAll(/(\d+)[\s.:-]*([A-D])(?:\b|$)/gi)];
                    if (matches.length >= 3) {
                        answersRaw = line;
                        remainingText = lines.slice(0, i).join('\n').trim();
                        break;
                    }
                }
            }

            const questionStartRegex = /\n\s*(?:1[\s.)\t]|question\s+1[\s.:-]*|q1[\s.:-])/i;
            const questionStartMatch = remainingText.match(questionStartRegex);
            if (questionStartMatch) {
                const index = questionStartMatch.index;
                readingRaw = remainingText.substring(0, index).trim();
                questionsRaw = remainingText.substring(index).trim();
            } else {
                readingRaw = remainingText;
                questionsRaw = "";
            }
            return { readingRaw, questionsRaw, answersRaw };
        }

        // ===== SHUFFLE HELPERS =====
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ===== PROCESS & GENERATE QUIZ =====
        function processAndGenerateQuiz(showNotify = true) {
            const bulkAllInOneText = document.getElementById('bulkAllInOne').value.trim();
            if (!bulkAllInOneText) {
                if (showNotify) showNotification("Vui lòng dán văn bản đề thi thô vào ô nhập liệu!", "warning");
                return;
            }

            const parsed = parseAllInOneText(bulkAllInOneText);
            const readingRaw = parsed.readingRaw;
            const questionsRaw = parsed.questionsRaw;
            const answersRaw = parsed.answersRaw;

            if (!readingRaw || !questionsRaw || !answersRaw) {
                if (showNotify) showNotification("Không thể bóc tách đề thi. Vui lòng đảm bảo đề thi có đủ: Bài đọc, câu hỏi và đáp án!", "error");
                return;
            }

            // READING
            const readingLines = readingRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const titleText = readingLines[0] || "Reading Comprehension Test";
            const authorText = (readingLines[1] && (readingLines[1].toLowerCase().startsWith('by') || readingLines[1].toLowerCase()
                .startsWith('tác giả'))) ? readingLines[1] : "";
            const bodyParagraphs = authorText ? readingLines.slice(2) : readingLines.slice(1);

            document.getElementById('renderTitle').textContent = titleText;
            document.getElementById('renderAuthor').textContent = authorText;
            let paragraphsHTML = '';
            bodyParagraphs.forEach(pText => {
                paragraphsHTML += `<p class="reading-paragraph">${pText}</p>`;
            });
            document.getElementById('renderParagraphs').innerHTML = paragraphsHTML;

            // ANSWERS
            let parsedAnswers = {};
            const answerLines = answersRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            answerLines.forEach(line => {
                const matches = [...line.matchAll(/(\d+)[\s.:-]*([A-D])(?:\b|$)/gi)];
                if (matches.length > 1) {
                    matches.forEach(m => {
                        parsedAnswers[m[1]] = { correct: m[2].toUpperCase(), explain: '' };
                    });
                } else if (matches.length === 1) {
                    const m = matches[0];
                    const qNum = m[1];
                    const ansLetter = m[2].toUpperCase();
                    const matchString = m[0];
                    const startIdx = line.indexOf(matchString);
                    let explainText = line.substring(startIdx + matchString.length).trim().replace(/^[\s.:-;\t]+/, '').trim();
                    parsedAnswers[qNum] = { correct: ansLetter, explain: explainText };
                }
            });

            // QUESTIONS
            let parsedQuestions = [];

            function parseOptions(optionsText) {
                let options = { A: '', B: '', C: '', D: '' };
                let hasOptions = false;
                const markers = [];
                const regex = /(?:^|\s+)([A-D])(?:[\s.)-]|$)/gi;
                let match;
                let nextExpected = 'A';
                while ((match = regex.exec(optionsText)) !== null) {
                    const letter = match[1].toUpperCase();
                    const index = match.index + match[0].indexOf(match[1]);
                    if (letter === nextExpected) {
                        markers.push({ letter, index });
                        if (nextExpected === 'A') nextExpected = 'B';
                        else if (nextExpected === 'B') nextExpected = 'C';
                        else if (nextExpected === 'C') nextExpected = 'D';
                        else break;
                    }
                }
                if (markers.length >= 2) {
                    hasOptions = true;
                    for (let i = 0; i < markers.length; i++) {
                        const current = markers[i];
                        const next = markers[i + 1];
                        const startIdx = current.index + 1;
                        const endIdx = next ? next.index : optionsText.length;
                        let text = optionsText.substring(startIdx, endIdx).trim().replace(/^[\s.)-:\t]+/, '').trim();
                        options[current.letter] = text;
                    }
                }
                return { options, hasOptions };
            }

            const rawQuestionBlocks = questionsRaw.split(/\n\s*(?=\d+[\s.)\t])/);
            rawQuestionBlocks.forEach(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 1) return;
                let questionText = lines[0].replace(/^\d+[\s.)\t]*/, '');
                let options = { A: '', B: '', C: '', D: '' };
                let hasOptions = false;
                const optionsText = lines.slice(1).join(' ');
                const parsed = parseOptions(optionsText);
                if (parsed.hasOptions) {
                    options = parsed.options;
                    hasOptions = true;
                } else {
                    lines.forEach((line, idx) => {
                        if (idx === 0) return;
                        const optionMatch = line.match(/^([A-D])[\s.)\t]+(.*)/i);
                        if (optionMatch) {
                            const key = optionMatch[1].toUpperCase();
                            options[key] = optionMatch[2].trim();
                            hasOptions = true;
                        }
                    });
                }
                if (hasOptions || questionText) {
                    parsedQuestions.push({ q: questionText, options: options });
                }
            });

            if (parsedQuestions.length === 0) {
                if (showNotify) showNotification("Không thể bóc tách câu hỏi. Kiểm tra định dạng A, B, C, D!", "error");
                return;
            }

            // Build original questions array with correct answers
            window._originalQuestions = parsedQuestions.map((item, index) => {
                const qNum = index + 1;
                const ansData = parsedAnswers[qNum] || { correct: 'A', explain: '' };
                return {
                    q: item.q,
                    options: { ...item.options },
                    correct: ansData.correct,
                    explain: ansData.explain || ''
                };
            });

            // Reset shuffle state
            window._currentQuestions = JSON.parse(JSON.stringify(window._originalQuestions));

            // Render
            renderQuestionsFromCurrent();
            document.body.classList.add('quiz-active');
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('quizSplitLayout').style.display = 'flex';
            document.getElementById('score-result').style.display = 'none';
            document.getElementById('inputPanel').classList.add('hidden');

            lucide.createIcons();

            updateProgress();
            if (showNotify) showNotification(`✨ Đã khởi tạo thành công ${window._currentQuestions.length} câu hỏi!`, "success");
            document.getElementById('questionsColumn').scrollTop = 0;
            document.getElementById('readingColumn').scrollTop = 0;
            triggerAutoSave();
        }

        // ===== RENDER QUESTIONS FROM CURRENT =====
        function renderQuestionsFromCurrent() {
            const area = document.getElementById('quizQuestionsArea');
            let html = '';
            window._currentQuestions.forEach((item, index) => {
                const qNum = index + 1;
                const correct = item.correct || 'A';
                const explanationHTML = `
                        <strong>🔑 Lời giải câu ${qNum}:</strong> 
                        <span class="correct-answer">Đáp án đúng: ${correct}. ${item.options[correct] || ''}</span>
                        ${item.explain ? ' — ' + item.explain : ''}
                    `;

                html += `
                        <div class="quiz-item" data-correct="${correct}" data-qnum="${qNum}">
                            <div class="quiz-item-text"><span class="qnum">${qNum}.</span> ${item.q}</div>
                    `;
                ['A', 'B', 'C', 'D'].forEach(letter => {
                    if (item.options[letter]) {
                        html += `
                                <label class="render-option" onclick="selectCardEffect(this, event)">
                                    <input type="radio" name="user_ans_${qNum}" value="${letter}" onchange="updateProgress()">
                                    <span class="custom-radio">${letter}</span>
                                    <span class="option-text">${item.options[letter]}</span>
                                </label>
                            `;
                    }
                });
                html += `
                            <div class="explanation-box" id="explain_${qNum}">${explanationHTML}</div>
                        </div>
                    `;
            });
            area.innerHTML = html;
            lucide.createIcons();
            // Re-bind radio events for progress
            document.querySelectorAll('.quiz-item input[type="radio"]').forEach(r => {
                r.addEventListener('change', updateProgress);
            });
            updateProgress();
        }

        // ===== SHUFFLE FUNCTIONS =====
        function shuffleQuestions() {
            if (window._originalQuestions.length === 0) {
                showNotification("Chưa có câu hỏi để trộn!", "warning");
                return;
            }
            // Copy original, shuffle array
            const shuffled = JSON.parse(JSON.stringify(window._originalQuestions));
            shuffleArray(shuffled);
            window._currentQuestions = shuffled;
            renderQuestionsFromCurrent();
            // Reset submitted state
            window._quizSubmitted = false;
            document.getElementById('score-result').style.display = 'none';
            document.getElementById('score-result').classList.remove('show');
            showNotification("🔄 Đã trộn thứ tự câu hỏi!", "success");
            saveDraftToLocal();
        }

        function shuffleOptions() {
            if (window._originalQuestions.length === 0) {
                showNotification("Chưa có câu hỏi để trộn đáp án!", "warning");
                return;
            }
            // Copy original
            const shuffled = JSON.parse(JSON.stringify(window._originalQuestions));
            // For each question, shuffle keys
            shuffled.forEach(item => {
                const keys = ['A', 'B', 'C', 'D'];
                const shuffledKeys = shuffleArray([...keys]);
                const newOptions = {};
                const oldCorrect = item.correct;
                // Map old key to new position
                const oldToNew = {};
                keys.forEach((oldKey, idx) => {
                    oldToNew[oldKey] = shuffledKeys[idx];
                });
                // Build new options
                keys.forEach(oldKey => {
                    const newKey = oldToNew[oldKey];
                    newOptions[newKey] = item.options[oldKey];
                });
                item.options = newOptions;
                // Update correct to new key
                item.correct = oldToNew[oldCorrect];
            });
            window._currentQuestions = shuffled;
            renderQuestionsFromCurrent();
            // Reset submitted state
            window._quizSubmitted = false;
            document.getElementById('score-result').style.display = 'none';
            document.getElementById('score-result').classList.remove('show');
            showNotification("🔄 Đã trộn thứ tự các đáp án!", "success");
            saveDraftToLocal();
        }

        function resetShuffle() {
            if (window._originalQuestions.length === 0) {
                showNotification("Chưa có câu hỏi để reset!", "warning");
                return;
            }
            window._currentQuestions = JSON.parse(JSON.stringify(window._originalQuestions));
            renderQuestionsFromCurrent();
            window._quizSubmitted = false;
            document.getElementById('score-result').style.display = 'none';
            document.getElementById('score-result').classList.remove('show');
            showNotification("↩️ Đã khôi phục thứ tự ban đầu!", "info");
            saveDraftToLocal();
        }

        // ===== UI HELPERS =====
        function selectCardEffect(label, event) {
            if (event) event.preventDefault();

            const radio = label.querySelector('input[type="radio"]');
            if (!radio) return;

            const container = label.parentElement;

            if (radio.checked) {
                radio.checked = false;
                label.classList.remove('selected-card');
                updateProgress();
                return;
            }

            container.querySelectorAll('.render-option').forEach(el => el.classList.remove('selected-card'));
            radio.checked = true;
            label.classList.add('selected-card');
            updateProgress();
        }

        function clearAllAnswers() {
            const radios = document.querySelectorAll('.quiz-item input[type="radio"]');
            radios.forEach(r => {
                r.checked = false;
                const label = r.closest('.render-option');
                if (label) label.classList.remove('selected-card');
            });
            window._quizSubmitted = false;
            const scoreEl = document.getElementById('score-result');
            scoreEl.style.display = 'none';
            scoreEl.classList.remove('show');
            updateProgress();
            showNotification('Đã bỏ chọn tất cả đáp án.', 'info');
            saveDraftToLocal();
        }

        // ===== CHECK ANSWERS =====
        function checkAnswers(showNotify = true) {
            const items = document.querySelectorAll('.quiz-item');
            if (items.length === 0) return;

            window._quizSubmitted = true;

            let unansweredCount = 0;
            items.forEach((item, idx) => {
                const qNum = idx + 1;
                if (!item.querySelector(`input[name="user_ans_${qNum}"]:checked`)) unansweredCount++;
            });
            if (unansweredCount > 0 && showNotify) {
                showNotification(`Bạn còn ${unansweredCount} câu chưa hoàn thành. Hãy cố gắng nhé!`, "warning");
            }

            let score = 0;
            items.forEach((item, idx) => {
                const qNum = idx + 1;
                const correct = item.getAttribute('data-correct');
                const selected = item.querySelector(`input[name="user_ans_${qNum}"]:checked`);
                const options = item.querySelectorAll('.render-option');
                const expBox = document.getElementById(`explain_${qNum}`);

                options.forEach(opt => {
                    opt.style.backgroundColor = '';
                    opt.style.borderColor = '';
                    opt.classList.remove('selected-card');
                });

                if (selected) {
                    if (selected.value === correct) {
                        score++;
                        selected.parentElement.style.backgroundColor = 'rgba(45,122,74,0.08)';
                        selected.parentElement.style.borderColor = '#2d7a4a';
                        if (expBox) expBox.classList.remove('is-wrong');
                    } else {
                        selected.parentElement.style.backgroundColor = 'rgba(200,60,60,0.08)';
                        selected.parentElement.style.borderColor = '#c83c3c';
                        if (expBox) expBox.classList.add('is-wrong');
                    }
                } else {
                    if (expBox) expBox.classList.add('is-wrong');
                }

                options.forEach(opt => {
                    const rdo = opt.querySelector('input');
                    if (rdo && rdo.value === correct) {
                        opt.style.borderWidth = "2px";
                        opt.style.borderColor = "var(--primary)";
                        opt.style.backgroundColor = 'rgba(124,58,237,0.05)';
                    }
                });

                if (expBox) expBox.style.display = 'block';
            });

            const scoreDisplay = document.getElementById('score-result');
            const rate = (score / items.length) * 100;
            let compliment = 'Hãy tiếp tục cố gắng nhé!';
            if (rate === 100) compliment = '🏆 Thật tuyệt vời! Điểm số tuyệt đối';
            else if (rate >= 80) compliment = '🌟 Tuyệt vời! Kết quả rất xuất sắc';
            else if (rate >= 50) compliment = '👍 Khá tốt! Bạn đang tiến bộ rất nhanh';

            scoreDisplay.innerHTML = `
                    <span class="score-emoji">🎉</span>
                    <span class="score-text">Đúng ${score} / ${items.length} câu</span>
                    <span class="score-detail">(${rate.toFixed(0)}%) — ${compliment}</span>
                `;
            scoreDisplay.style.display = 'block';
            scoreDisplay.classList.remove('show');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('show');

            if (showNotify) showNotification(`Bạn đạt ${score}/${items.length} câu đúng!`, "success");
            document.getElementById('questionsColumn').scrollTop = 0;
            saveDraftToLocal();
        }

        // ===== EXPOSE GLOBALS =====
        window.toggleInputPanel = toggleInputPanel;
        window.switchMobileTab = switchMobileTab;
        window.updateProgress = updateProgress;
        window.processAndGenerateQuiz = processAndGenerateQuiz;
        window.selectCardEffect = selectCardEffect;
        window.checkAnswers = checkAnswers;
        window.clearAllAnswers = clearAllAnswers;
        window.showNotification = showNotification;
        window.shuffleQuestions = shuffleQuestions;
        window.shuffleOptions = shuffleOptions;
        window.resetShuffle = resetShuffle;
    </script>

</body>
</html>
